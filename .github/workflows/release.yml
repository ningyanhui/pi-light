name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.0-alpha)"
        required: true
        default: "v0.3.0-alpha"
      draft:
        description: "Create as draft release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PI_LIGHT_PI_ZIP_SHA256: "0f7256ea8bdac3af20012b94fdc1252a31cc6dc0d2f9b9eb539555d22e3e321b"
  # MinGit for Windows v2.47.1.windows.2 — portable bash/MSYS environment (no Node bundled)
  # SHA-256 sourced from the official release: https://github.com/git-for-windows/git/releases/tag/v2.47.1.windows.2
  PI_LIGHT_MINGIT_URL: "https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.2/MinGit-2.47.1.2-64-bit.zip"
  PI_LIGHT_MINGIT_SHA256: "5bafb35dfb249b89d726b37824eeb5022379f0e51f5fbf9c29f49bef57e85b42"

jobs:
  build-windows:
    name: Windows portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Workspace target dir is repo-root `target/` (see root Cargo.toml), not desktop-rust/target/.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-win-registry-${{ hashFiles('Cargo.toml', 'desktop-rust/Cargo.toml') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: cargo build --release (pi-light bin)
        run: cargo build --release -p pi-light --bin pi-light

      - name: List release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          foreach ($dir in @("target/release", "desktop-rust/target/release")) {
            if (Test-Path -LiteralPath $dir) {
              Write-Host "=== $dir ==="
              Get-ChildItem -LiteralPath $dir -Filter *.exe | ForEach-Object { Write-Host $_.FullName }
            } else {
              Write-Host "=== (missing) $dir ==="
            }
          }

      - name: Stage portable directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Resolve-PiLightExe {
            param([string[]] $ReleaseDirs)
            foreach ($dir in $ReleaseDirs) {
              if (-not (Test-Path -LiteralPath $dir)) { continue }
              $preferred = Join-Path $dir "pi-light.exe"
              if (Test-Path -LiteralPath $preferred) { return $preferred }
              $candidates = Get-ChildItem -LiteralPath $dir -Filter *.exe |
                Where-Object { $_.Name -ne "mock-pi.exe" } |
                Sort-Object Name
              if ($candidates.Count -eq 1) { return $candidates[0].FullName }
              if ($candidates.Count -gt 1) {
                $named = $candidates | Where-Object { $_.BaseName -eq "pi-light" }
                if ($named) { return $named[0].FullName }
              }
            }
            Write-Host "error: could not locate pi-light.exe; listing release dirs:" -ForegroundColor Red
            foreach ($dir in $ReleaseDirs) {
              if (Test-Path -LiteralPath $dir) {
                Write-Host "--- $dir ---"
                Get-ChildItem -LiteralPath $dir | ForEach-Object { Write-Host $_.Name }
              }
            }
            exit 1
          }

          $piLightExe = Resolve-PiLightExe @("target/release", "desktop-rust/target/release")
          Write-Host "Using pi-light binary: $piLightExe"

          $root = "pi-light-windows-x64"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Path "$root/sidecar/pi" -Force | Out-Null
          New-Item -ItemType Directory -Path "$root/sidecar/bash" -Force | Out-Null
          New-Item -ItemType Directory -Path "$root/sidecar/pi-packages" -Force | Out-Null
          New-Item -ItemType Directory -Path "$root/sidecar/relay" -Force | Out-Null
          Copy-Item -LiteralPath $piLightExe -Destination "$root/pi-light.exe"
          Copy-Item "NOTICE" "$root/NOTICE"
          Copy-Item "LICENSE" "$root/LICENSE"
          Copy-Item "docs/preset-packages.md" "$root/preset-packages.md"

          # Fetch Pi sidecar (SHA-256 verified inside the script)
          & ./scripts/fetch-pi-sidecar.ps1 -DestDir "$root/sidecar/pi"

          # Fetch portable bash (MinGit, SHA-256 verified inside the script)
          & ./scripts/fetch-bash-sidecar.ps1 `
              -DestDir "$root/sidecar/bash" `
              -MinGitUrl "$env:PI_LIGHT_MINGIT_URL" `
              -ExpectedSha256 "$env:PI_LIGHT_MINGIT_SHA256"

      - name: Fetch preset Pi packages (SHA-256 verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $npm = Get-Command npm -ErrorAction SilentlyContinue
          if (-not $npm) { throw "npm missing after setup-node" }
          Write-Host "npm: $($npm.Source)"
          npm --version
          python scripts/fetch-pi-packages.py `
            --dest "pi-light-windows-x64/sidecar/pi-packages" `
            --install-deps `
            --check-docs
          $required = @(
            "pi-marketplace",
            "pi-mcp-adapter",
            "pi-web-access",
            "pi-memory",
            "pi-subagents",
            "pi-browser-use",
            "pi-chrome-connector"
          )
          foreach ($name in $required) {
            $dir = Join-Path "pi-light-windows-x64/sidecar/pi-packages" $name
            $manifest = Join-Path $dir "package.json"
            if (-not (Test-Path -LiteralPath $manifest)) {
              throw "missing preset package: $manifest"
            }
          }
          $computer = "pi-light-windows-x64/sidecar/pi-packages/@injaneity/pi-computer-use/package.json"
          if (-not (Test-Path -LiteralPath $computer)) {
            throw "missing preset package: $computer"
          }
          if (Test-Path "pi-light-windows-x64/sidecar/pi-packages/pi-lens") {
            throw "pi-lens must not be shipped in the default preset tree"
          }
          if (Test-Path "pi-light-windows-x64/sidecar/pi-packages/billion-context") {
            throw "billion-context must not be shipped in the default preset tree"
          }

      - name: Fetch cloudflared (SHA-256 verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./scripts/fetch-cloudflared.ps1 -DestDir "pi-light-windows-x64/sidecar/relay"
          $exe = "pi-light-windows-x64/sidecar/relay/cloudflared.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "cloudflared.exe missing after fetch"
          }
          $expected = ((Get-Content -LiteralPath "scripts/cloudflared.lock.json" -Raw | ConvertFrom-Json).artifacts.'windows-amd64'.sha256).ToLowerInvariant()
          $got = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $expected) {
            throw "cloudflared SHA-256 mismatch after fetch: expected $expected got $got"
          }

      - name: Create Windows zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "pi-light-windows-x64" -DestinationPath "pi-light-windows-x64.zip" -Force
          if (-not (Test-Path "pi-light-windows-x64.zip")) { throw "zip missing" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-light-windows-x64
          path: pi-light-windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        working-directory: .
        run: |
          set -euo pipefail
          CM="${ANDROID_HOME}/cmdline-tools"
          if [ ! -x "${CM}/latest/bin/sdkmanager" ]; then
            mkdir -p "${CM}"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp
            rm -rf "${CM}/latest"
            mv /tmp/cmdline-tools "${CM}/latest"
          fi
          SDKMAN="${CM}/latest/bin/sdkmanager"
          set +o pipefail
          yes | "${SDKMAN}" --licenses >/dev/null || true
          set -o pipefail
          "${SDKMAN}" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-light-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Layout release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release-artifacts/pi-light-windows-x64/pi-light-windows-x64.zip dist/
          cp release-artifacts/pi-light-android-debug/app-debug.apk dist/app-debug.apk
          ls -la dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: pi-light ${{ steps.meta.outputs.tag }}
          body_path: .github/release-notes/v0.3.0-alpha.md
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ contains(steps.meta.outputs.tag, 'alpha') }}
          files: |
            dist/pi-light-windows-x64.zip
            dist/app-debug.apk
          generate_release_notes: false
