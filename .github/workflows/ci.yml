name: CI

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -----------------------------------------------------------------------
  # desktop-rust: cargo check (cross-platform)
  # -----------------------------------------------------------------------
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop-rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # egui/eframe on Linux requires libgl + X11/Wayland headers for linking
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: cargo check (desktop-rust)
        working-directory: desktop-rust
        run: cargo check --all-targets

      - name: cargo test (desktop-rust)
        working-directory: desktop-rust
        run: cargo test --all-targets

  # -----------------------------------------------------------------------
  # Lint: cargo clippy warnings-as-errors (Ubuntu only for speed)
  # -----------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-rust/target
          key: ubuntu-clippy-${{ hashFiles('desktop-rust/Cargo.toml') }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: cargo clippy
        working-directory: desktop-rust
        run: cargo clippy --all-targets -- -D warnings

  # -----------------------------------------------------------------------
  # Format check
  # -----------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        working-directory: desktop-rust
        run: cargo fmt --check

  # -----------------------------------------------------------------------
  # 文案禁词（远程桌面不得使用已废弃命名）
  # -----------------------------------------------------------------------
  forbidden-words:
    name: forbidden-words
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject banned remote-desktop wording
        run: |
          set -euo pipefail
          # 禁词拆开写，避免本文件命中扫描。
          needle="$(printf '%s%s' $'\u6e38\u620f' $'\u6a21\u5f0f')"
          if grep -RIn --exclude-dir=.git --exclude-dir=target \
            --include='*.rs' --include='*.md' --include='*.yml' --include='*.toml' \
            --include='*.json' --include='*.kt' --include='*.xml' \
            -- "$needle" .; then
            echo "forbidden phrase found"
            exit 1
          fi
          echo "ok: no banned remote-desktop wording"
