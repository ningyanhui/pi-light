[package]
name = "pi-light"
version = "0.1.0"
edition = "2021"
description = "pi-light — 内嵌 Pi 的轻量 Rust Shell (egui/eframe)"
license = "Apache-2.0"
repository = "https://github.com/ningyanhui/pi-light"
homepage = "https://github.com/ningyanhui/pi-light"
keywords = ["pi", "egui", "ai", "shell", "coding-agent"]
categories = ["gui"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"

# Windows: don't spawn a console window when running the GUI binary
[target.'cfg(windows)'.dependencies]

[[bin]]
name = "pi-light"
path = "src/main.rs"
