[package]
name = "pi-light"
version = "0.3.2"
edition = "2021"
description = "pi-light — 内嵌 Pi 的轻量 Rust Shell (egui/eframe)"
license = "Apache-2.0"
repository = "https://github.com/ningyanhui/pi-light"
homepage = "https://github.com/ningyanhui/pi-light"
keywords = ["pi", "egui", "ai", "shell", "coding-agent"]
categories = ["gui"]

[lib]
name = "pi_light"
path = "src/lib.rs"

[[bin]]
name = "pi-light"
path = "src/main.rs"

# Mock Pi RPC server — used by integration tests when no real Pi binary is available
[[bin]]
name = "mock-pi"
path = "src/bin/mock_pi.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
getrandom = "0.2"
jpeg-encoder = "0.6"
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png"] }
# 钉住以免 crates.io 最新传递依赖要求 edition2024 / rustc>1.83
zeroize = "=1.8.1"
# GFM 子集解析（表 / 强调 / 围栏代码）。渲染在 markdown_ui，不走裸 Label。
# 钉 0.12：0.13+ TagEnd 拆分且部分版本 MSRV > rustc 1.83。
pulldown-cmark = { version = "0.12", default-features = false }
# Native folder picker (MIT). Linux uses the default gtk3 backend.
rfd = "0.15"

# Windows: don't spawn a console window when running the GUI binary
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
