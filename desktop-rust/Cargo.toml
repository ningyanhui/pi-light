[package]
name = "pi-light"
version = "0.2.2"
edition = "2021"
description = "pi-light — 内嵌 Pi 的轻量 Rust Shell (egui/eframe)"
license = "Apache-2.0"
repository = "https://github.com/ningyanhui/pi-light"
homepage = "https://github.com/ningyanhui/pi-light"
keywords = ["pi", "egui", "ai", "shell", "coding-agent"]
categories = ["gui"]

[lib]
name = "pi_light"
path = "src/lib.rs"

[[bin]]
name = "pi-light"
path = "src/main.rs"

# Mock Pi RPC server — used by integration tests when no real Pi binary is available
[[bin]]
name = "mock-pi"
path = "src/bin/mock_pi.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"

# Windows: don't spawn a console window when running the GUI binary
[target.'cfg(windows)'.dependencies]

[dev-dependencies]
tempfile = "3"
